[project]
name = "nom-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "grequests>=0.7.0",
    "pdoc>=15.0.1",
    "pyhumps>=3.8.0",
    "python-dotenv>=1.0.1",
    "pytz>=2025.1",
    "requests>=2.32.3",
    "us>=3.2.0",
]

[dependency-groups]
analysis-tools = [
    "pandas>=2.3.3",
    "pyspark==4",
]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=9.0.2",
]

[tool.pyright]
typeCheckingMode = "off"

[tool.ruff]
line-length = 120
target-version = "py311"
lint.select = [
    "ALL", # include all the rules, including new ones
]
lint.ignore = [
    #### modules
    "ANN", # flake8-annotations
    "COM", # flake8-commas
    "C90", # mccabe complexity
    "DJ",  # django
    "EXE", # flake8-executable
    "T10", # debugger
    "TID", # flake8-tidy-imports

    #### specific rules
    "D100",   # ignore missing docs
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D200",
    "D203",
    "D205",
    "D212",
    "D400",
    "D401",
    "D415",
    "E402",   # false positives for local imports
    "E501",   # line too long
    "TRY003", # external messages in exceptions are too verbose
    "TD002",
    "TD003",
    "FIX002", # too verbose descriptions of todos
]
exclude  = ["scratchpad.ipynb", "testing.ipynb"]
[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20
